<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>(주)솔루션 실적 전자책</title>

<!-- 링크 공유 시 썸네일/OG 태그 -->
<meta property="og:title" content="(주)솔루션 실적 전자책">
<meta property="og:description" content="솔루션의 환경설비 도입 실적 모음">
<meta property="og:image" content="https://soullution21-stack.github.io/solution-casebook/assets/og-logo.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<style>
/* ===== 기본 변수 / 리셋 ===== */
:root{
  --bg:#f4f7fb;--line:#dce4ef;--text:#101828;--muted:#667085;
  --blue:#0f62fe;--navy:#0f4387;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Pretendard,Apple SD Gothic Neo,Segoe UI,sans-serif;
}
body.locked{overflow:hidden}

/* ===== 로그인 화면 ===== */
.login-overlay{
  position:fixed;inset:0;background:#0b1f3b;
  display:flex;align-items:center;justify-content:center;z-index:999;
  animation:fadeIn .4s ease;
}
.login-card{
  width:min(400px,92vw);background:#fff;border-radius:24px;
  padding:32px 28px;box-shadow:0 24px 70px rgba(0,0,0,.4);
  animation:slideUp .4s cubic-bezier(.22,.68,0,1.2);
}
.login-card h1{font-size:22px;margin:0 0 6px;color:var(--navy)}
.login-card p{color:#667085;margin:0 0 20px;font-size:14px}
.pw-wrap{position:relative;margin-bottom:12px}
.pw-wrap input{
  width:100%;padding:13px 44px 13px 15px;border:1px solid var(--line);
  border-radius:12px;font-size:15px;box-sizing:border-box;
  transition:border-color .2s;
}
.pw-wrap input:focus{outline:none;border-color:var(--blue)}
.pw-wrap .eye-btn{
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:0;
  width:auto;color:#94a3b8;display:flex;align-items:center;
  font-size:0;line-height:1;
}
.pw-wrap .eye-btn svg{width:20px;height:20px;stroke:#94a3b8;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pw-wrap .eye-btn:hover svg{stroke:#475467}
.login-card .login-submit{
  width:100%;padding:13px;border:0;border-radius:12px;
  background:var(--blue);color:#fff;font-weight:700;font-size:15px;cursor:pointer;
  transition:background .15s;
}
.login-card .login-submit:hover{background:#0353e9}
.login-hint{text-align:center;color:#98a2b3;margin-top:10px;font-size:13px}
.error{display:none;color:#d92d20;font-size:13px;margin-bottom:6px}

/* ===== 헤더 ===== */
header{
  position:sticky;top:0;
  background:rgba(244,247,251,.95);backdrop-filter:blur(10px);
  z-index:50;border-bottom:1px solid var(--line);
}
.wrap{max-width:1680px;margin:0 auto;padding:16px 22px}
.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;margin:0}
.sub{font-size:13px;color:#667085;margin-top:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== 버튼 공통 ===== */
.btn{
  border:1px solid var(--line);background:#fff;color:#1d2939;
  padding:9px 12px;border-radius:12px;font-weight:800;font-size:13px;
  cursor:pointer;text-decoration:none;transition:opacity .15s,box-shadow .15s;
}
.btn:hover{opacity:.85}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.good{background:#ecfdf3;color:#15803d;border-color:#bbf7d0}
.btn.warn{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.btn.danger{background:#fef2f2;color:#dc2626;border-color:#fecaca}

/* ===== 필터 바 ===== */
.filters{display:grid;grid-template-columns:2.15fr .85fr 1.15fr 1.15fr 1.25fr;gap:10px}
.filters input,.filters select{
  height:44px;border:1px solid var(--line);border-radius:14px;
  background:#fff;padding:0 14px;font-size:14px;
  transition:border-color .2s;
}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--blue)}
.search{position:relative}
.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
.search input{width:100%;padding-left:42px}

/* ===== 메인 / 카드 그리드 ===== */
main{max-width:1680px;margin:0 auto;padding:16px 22px 40px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:4px 0 12px}
.count{font-weight:900}
.hint{font-size:13px;color:#667085}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}

/* ===== 카드 ===== */
.card{
  background:#fff;border:1px solid var(--line);border-radius:18px;
  overflow:hidden;box-shadow:0 8px 24px rgba(16,42,90,.08);
  cursor:pointer;position:relative;display:flex;flex-direction:column;
  /* 카드 진입 애니메이션 */
  animation:cardIn .35s ease both;
  transition:transform .18s,box-shadow .18s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(16,42,90,.14)}
.head{padding:12px 13px 10px}
.pill{
  display:inline-flex;color:#fff;border-radius:999px;
  font-size:12px;font-weight:900;padding:7px 10px;margin-bottom:9px;
}
.company{font-size:19px;font-weight:950;letter-spacing:-.03em;margin:2px 0 6px}
.assign{
  font-size:12.5px;line-height:1.35;color:#475467;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;min-height:34px;
}
.industry{margin-top:7px;font-size:11.5px;color:#667085;font-weight:800}
.cover{
  width:100%;aspect-ratio:4/3;background:#fff center/contain no-repeat;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  overflow:hidden;position:relative;
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover iframe{
  position:absolute;top:0;left:-17px;
  width:calc(100% + 34px);height:calc(100% + 40px);
  border:0;pointer-events:none;overflow:hidden;
}
.equip{
  padding:10px 14px 14px;display:flex;flex-direction:column;
  align-items:stretch;justify-content:flex-start;gap:7px;
}
.eq{
  width:100%;text-align:center;border:1px solid #d7e6ff;
  background:#f1f7ff;color:#124a96;border-radius:999px;
  padding:7px 9px;font-size:12px;font-weight:850;cursor:pointer;
  transition:background .15s,color .15s;
}
.eq:hover{background:var(--blue);color:#fff}
.hit{color:#e11d48;font-weight:1000;background:#fff1f2;border-radius:4px}
.edit{
  position:absolute;right:10px;top:10px;background:#111827;color:#fff;
  border:0;border-radius:999px;padding:6px 9px;font-size:12px;
  font-weight:900;cursor:pointer;z-index:3;
}
.hidden-badge{
  position:absolute;left:10px;top:10px;background:#dc2626;color:#fff;
  border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900;z-index:3;
}

/* ===== 전체화면 PDF 뷰어 (프레젠터) ===== */
.presenter{
  display:none;position:fixed;inset:0;background:#05070d;
  z-index:300;color:#fff;grid-template-rows:0 1fr;
}
.presenter.show{
  display:grid;
  animation:fadeIn .25s ease;
}
.ptop{
  height:0;overflow:hidden;display:flex;align-items:center;
  justify-content:space-between;gap:12px;padding:0 12px;
  background:rgba(0,0,0,.88);border-bottom:0;
  transition:height .2s;
}
.presenter:hover .ptop{height:44px;border-bottom:1px solid rgba(255,255,255,.12)}
.ptitle{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:12px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close{
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.09);
  color:#fff;border-radius:999px;padding:8px 12px;font-weight:900;cursor:pointer;
}
.pdf{width:100%;height:100vh;border:0;background:#111}
.nav{
  position:fixed;top:50%;transform:translateY(-50%);z-index:340;
  width:54px;height:86px;border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.35);color:#fff;border-radius:18px;
  font-size:34px;font-weight:900;cursor:pointer;
  transition:background .15s;
}
.nav:hover{background:rgba(15,98,254,.75)}
.prev{left:18px}
.next{right:18px}

/* ===== 수정 모달 ===== */
.modal{
  display:none;position:fixed;inset:0;
  background:rgba(15,23,42,.72);z-index:500;
  align-items:center;justify-content:center;padding:22px;
}
.modal.show{
  display:flex;
  animation:fadeIn .2s ease;
}
.panel{
  width:min(1500px,98vw);height:94vh;background:#fff;
  border-radius:22px;display:flex;flex-direction:column;overflow:hidden;
  animation:slideUp .25s cubic-bezier(.22,.68,0,1.2);
}
.phead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.pbody{display:grid;grid-template-columns:minmax(520px,1.15fr) minmax(520px,.95fr);min-height:0;flex:1}
.preview{background:#0b1020;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.toolbar{
  padding:10px 12px;display:flex;gap:8px;align-items:center;
  flex-wrap:wrap;background:#111827;color:#fff;
}
.toolbar input{
  width:86px;border:1px solid rgba(255,255,255,.22);
  background:#fff;color:#111827;border-radius:10px;padding:8px;
}
.toolbar .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.prevframe{width:100%;height:100%;border:0;background:#111;flex:1}
.editor{padding:18px 20px;overflow:auto}
.note{
  background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
  border-radius:14px;padding:10px 12px;font-size:13px;margin:0 0 12px;
}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:12px;color:#667085;font-weight:900;margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:12px;
  padding:10px;font-size:14px;
}
.field textarea{min-height:70px}
.full{grid-column:1/-1}
.selectadd{display:grid;grid-template-columns:1fr auto auto;gap:7px}
.miniadd{border:1px solid #bfdbfe;background:#eff6ff;color:#0f4387;border-radius:12px;padding:10px;font-weight:900;cursor:pointer}
.minidel{border:1px solid #fecaca;background:#fef2f2;color:#dc2626;border-radius:12px;padding:10px;font-weight:900;cursor:pointer}
.etable{width:100%;border-collapse:collapse;margin-top:16px}
.etable th,.etable td{border-bottom:1px solid #edf2f7;padding:8px;font-size:13px;vertical-align:top}
.etable th{background:#f8fafc;color:#475467;text-align:left}
.etable input,.etable select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px}
.foot{
  padding:14px 20px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fbfdff;
}
.save{font-size:12px;color:#15803d;font-weight:900;margin-left:8px}

/* ===== 애니메이션 키프레임 ===== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ===== 모바일 반응형 ===== */
@media(max-width:768px){
  /* 헤더 */
  .wrap{padding:12px 14px}
  h1{font-size:17px}
  .top{margin-bottom:8px;gap:8px}
  .actions{gap:6px}
  .btn{padding:7px 10px;font-size:12px}

  /* 필터: 검색창 전체 너비 → 나머지 2열 */
  .filters{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .filters .search{grid-column:1/-1}  /* 검색창은 전체 너비 */
  .filters input,.filters select{height:40px;font-size:13px}

  /* 카드 그리드 */
  .cards{grid-template-columns:1fr;gap:12px}
  main{padding:12px 14px 32px}
  .company{font-size:17px}

  /* 프레젠터 네비 버튼 */
  .nav{width:42px;height:64px;font-size:26px}
  .prev{left:8px}
  .next{right:8px}

  /* 수정 모달: 단열 */
  .pbody{grid-template-columns:1fr}
  .preview{height:40vh}
  .form{grid-template-columns:1fr}
  .panel{height:98vh;border-radius:16px}
}

@media(max-width:480px){
  /* 극소형: 필터 전부 1열 */
  .filters{grid-template-columns:1fr}
  .filters .search{grid-column:auto}
  .hint{display:none}  /* 안내문구 숨김 */
}
</style>
</head>

// ===== 카드 데이터 정규화 (uid, thumbPage 등 누락값 보정) =====
function ensure(p,i=0){
  if(!p.uid)p.uid=String(p.id||p.pdf||p.company||i).replace(/[^0-9A-Za-z가-힣_]+/g,'_')+'_'+i;
  if(!p.thumbPage)p.thumbPage=1;
  if(!p.mainPage)p.mainPage=1;
  if(p.showCard===undefined)p.showCard=true;
  if(!p.items)p.items=[];
  p.items.forEach((x,j)=>{
    if(!x.id)x.id='equip_'+(j+1);
    if(!x.page)x.page=1;
    if(x.show===undefined)x.show=true;
    if(!x.keywords)x.keywords=[];
  });
  return p;
}

function loadData(){
  try{
    let s=localStorage.getItem('solution_casebook_data_v'+VERSION)
      ||localStorage.getItem('solution_casebook_data_v42')
      ||localStorage.getItem('solution_casebook_data_v41')
      ||localStorage.getItem('solution_casebook_data_v40')
      ||localStorage.getItem('solution_casebook_data_v27');
    return (s?JSON.parse(s):clone(DEFAULT_DATA)).map(ensure);
  }catch(e){return clone(DEFAULT_DATA).map(ensure)}
}

function login(){
  const val = els.pwInput.value;
  const errEl = els.loginError;
  if(val === ''){
    errEl.textContent = '비밀번호를 입력해 주세요.';
    errEl.style.display = 'block';
    return;
  }
  if(val === PASSWORD){
    document.body.classList.remove('locked');
    els.loginOverlay.style.display='none';
    sessionStorage.setItem('casebook_login','1');
    errEl.style.display='none';
  } else {
    errEl.textContent = '비밀번호가 올바르지 않습니다. (입력값: ' + val.length + '자)';
    errEl.style.display='block';
    els.pwInput.select();
    console.log('[login] 입력값 길이:', val.length, '/ 예상 길이:', PASSWORD.length);
  }
}
els.loginBtn.addEventListener('click',login);

// ===== 필터 드롭다운 채우기 =====
const uniq=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y),'ko'));
function fill(sel,arr,first){
  sel.innerHTML='<option value="">'+first+'</option>';
  arr.forEach(v=>sel.add(new Option(v,v)));
}
function filters(){
  fill(els.yearFilter,     uniq(DATA.map(p=>p.year)),'연도 검색');
  fill(els.businessFilter, uniq([...BUSINESSES,...DATA.map(p=>p.businessShort)]),'사업 검색');
  fill(els.industryFilter, uniq([...INDUSTRIES,...DATA.map(p=>p.industry)]),'업종 검색');
  fill(els.fieldFilter,    FIELD_ORDER.filter(v=>DATA.some(p=>(p.items||[]).some(i=>i.field===v&&i.show!==false))),'분야 검색');
}

// ===== 텍스트 유틸 =====
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const norm=s=>String(s||'').toLowerCase().replace(/[\s_\-·ㆍ,./(){}\[\]]+/g,'');
function mark(s,q){
  s=esc(s);
  if(!q)return s;
  let safe=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return s.replace(new RegExp(safe,'gi'),m=>'<span class="hit">'+m+'</span>');
}
// 카드 전체 검색 대상 텍스트 생성
function text(p){
  return[p.year,p.businessShort,p.project,p.company,p.industry,p.assignment,
         ...(p.tags||[]),...(p.items||[]).flatMap(i=>[i.name,i.field,...(i.keywords||[])])
        ].join(' ').toLowerCase();
}
function itemMatch(i,q){
  let raw=[i.name,...(i.keywords||[])].join(' ').toLowerCase();
  return q&&(raw.includes(q.toLowerCase())||norm(raw).includes(norm(q)));
}

// ===== 필터 적용 & 렌더링 =====
function apply(){
  let q=els.searchInput.value.trim().toLowerCase(),nq=norm(q);
  filtered=DATA.filter(p=>
    (showHidden||p.showCard!==false)
    &&(!q||text(p).includes(q)||norm(text(p)).includes(nq))
    &&(!els.yearFilter.value    ||p.year===els.yearFilter.value)
    &&(!els.businessFilter.value||p.businessShort===els.businessFilter.value)
    &&(!els.industryFilter.value||p.industry===els.industryFilter.value)
    &&(!els.fieldFilter.value   ||(p.items||[]).some(i=>i.field===els.fieldFilter.value&&i.show!==false))
  );
  render();
}

// ===== 카드에 표시할 설비 버튼 목록 =====
function pitems(p){
  let q=els.searchInput.value.trim().toLowerCase(),f=els.fieldFilter.value;
  return(p.items||[]).filter(i=>
    i.show!==false
    &&(!f||i.field===f)
    &&(!q||text(p).includes(q)||norm(text(p)).includes(norm(q)))
  );
}

// ===== 썸네일 HTML 생성 =====
function cover(p){
  let tp=Number(p.thumbPage||1);
  // cover 이미지가 있으면 img 태그로 (onerror 시 숨김)
  if(p.cover) return `<div class="cover"><img src="${p.cover}" alt="${esc(p.company)}" loading="lazy" onerror="this.style.display='none'"></div>`;
  // cover 없고 PDF만 있으면 iframe으로 렌더링
  if(p.pdf){
    const src=p.pdf.includes('drive.google.com')
      ? p.pdf.replace('/preview','')+'/preview?rm=minimal&page='+tp
      : `${p.pdf}#page=${tp}&view=Fit&zoom=page-fit&toolbar=0&navpanes=0&scrollbar=0`;
    return `<div class="cover"><iframe src="${src}"></iframe></div>`;
  }
  return '<div class="cover"><div style="padding:40px;text-align:center;color:#94a3b8">썸네일 없음</div></div>';
}

// ===== 카드 렌더링 =====
function render(){
  els.cards.innerHTML='';
  els.resultCount.textContent='총 '+filtered.length+'개사';
  filtered.forEach((p,idx)=>{
    let q=els.searchInput.value.trim();
    let color=COLORS[p.businessShort]||'#475467';
    let card=document.createElement('article');
    card.className='card';
    card.style.animationDelay=(idx*25)+'ms';  // 카드 순차 진입 애니메이션

    let eq=pitems(p).map(i=>
      '<button class="eq '+(q&&itemMatch(i,q)?'match':'')+'" data-uid="'+esc(p.uid)+'" data-page="'+esc(i.page)+'">'+
      mark(i.name,q)+'<span style="font-size:11px;opacity:0.7;margin-left:3px">p.'+i.page+'</span></button>'
    ).join('')||'<span style="font-size:12px;color:#667085">도입설비 미입력</span>';

    card.innerHTML=
      (p.showCard===false?'<span class="hidden-badge">숨김</span>':'')+
      (adminMode?'<button class="edit" data-edit="'+esc(p.uid)+'">수정</button>':'')+
      '<div class="head">'+
        '<span class="pill" style="background:'+color+'">'+esc(p.year)+'년 '+esc(p.businessShort)+'</span>'+
        '<div class="company">'+mark(p.company,q)+'</div>'+
        '<div class="assign">'+mark(p.assignment,q)+'</div>'+
        '<div class="industry">'+esc(p.industry)+'</div>'+
      '</div>'+
      cover(p)+
      '<div class="equip">'+eq+'</div>';

    // 카드 클릭 → Drive면 새 탭, 아니면 프레젠터
    card.addEventListener('click',()=>{
      if(p.pdf&&p.pdf.includes('drive.google.com')){
        const _id=p.pdf.match(/\/d\/([^/]+)\//)?.[1];
        if(_id){window.open('https://drive.google.com/file/d/'+_id+'/view','_blank');return;}
      }
      openPDF(p.uid,1);
    });

    // 설비 버튼 클릭
    card.querySelectorAll('.eq').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      const _p=get(b.dataset.uid);
      if(_p&&_p.pdf&&_p.pdf.includes('drive.google.com')){
        const _id=_p.pdf.match(/\/d\/([^/]+)\//)?.[1];
        if(_id){window.open('https://drive.google.com/file/d/'+_id+'/view#page='+(Number(b.dataset.page)||1),'_blank');return;}
      }
      openPDF(b.dataset.uid,Number(b.dataset.page)||1);
    }));

    // 수정 버튼 클릭 (관리모드)
    let eb=card.querySelector('.edit');
    if(eb)eb.addEventListener('click',e=>{e.stopPropagation();openEdit(eb.dataset.edit)});

    els.cards.appendChild(card);
  });
}

const get=uid=>DATA.find(p=>p.uid===uid);

// PDF URL 생성 (Drive / 로컬 파일 구분)
const pdfurl=(p,page,slide=true)=>{
  if(p.pdf.includes('drive.google.com'))
    return p.pdf.replace('/preview','')+'/preview?rm=minimal&page='+page;
  const sep=p.pdf.includes('#')?'&':'#';
  return p.pdf+sep+'page='+page+'&view=Fit&zoom=page-fit&toolbar='+(slide?'0':'1')+'&navpanes=0&scrollbar=0';
};

function openPDF(uid,page){
  if(adminMode)return;
  let p=get(uid);if(!p)return;
  activeUid=uid;activePage=Number(page)||1;activeTotal=Number(p.pageCount)||999;
  els.presenterTitle.textContent=p.year+'년 '+p.businessShort+' · '+p.company;
  els.presenterMeta.textContent=p.assignment;
  els.presenter.classList.add('show');
  document.body.style.overflow='hidden';
  updatePDF();
  setTimeout(()=>{
    try{els.presenter.focus();if(els.presenter.requestFullscreen)els.presenter.requestFullscreen().catch(()=>{});}catch(e){}
  },50);
}
function updatePDF(){
  let p=get(activeUid);if(!p)return;
  activePage=Math.max(1,Math.min(Number(p.pageCount)||999,activePage));
  const src=pdfurl(p,activePage,true);
  els.pdfFrame.src='about:blank';
  setTimeout(()=>{els.pdfFrame.src=src;},10);
}
function move(d){if(activeUid){activePage+=d;updatePDF()}}
function closePDF(){
  try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(e){}
  els.presenter.classList.remove('show');
  els.pdfFrame.src='';
  document.body.style.overflow='';
  activeUid=null;
}

// ===== GitHub 저장 =====
async function saveToGithub(){
  if(!GITHUB_TOKEN||GITHUB_TOKEN==='REPLACE_TOKEN'){
    alert('GitHub Token이 설정되지 않았습니다.');return;
  }
  const btn=els.githubSaveBtn;
  btn.textContent='저장 중...';btn.disabled=true;
  try{
    // 1. 현재 파일 SHA + 내용 가져오기
    const shaRes=await fetch('https://api.github.com/repos/'+GITHUB_REPO+'/contents/'+GITHUB_FILE,{
      headers:{'Authorization':'token '+GITHUB_TOKEN,'Accept':'application/vnd.github.v3+json'}
    });
    if(!shaRes.ok)throw new Error('GitHub 파일 조회 실패: '+shaRes.status);
    const shaData=await shaRes.json();

    // 2. DEFAULT_DATA를 현재 DATA로 교체 (END_DEFAULT_DATA 마커 기준)
    const currentContent=new TextDecoder().decode(
      Uint8Array.from(atob(shaData.content.replace(/\n/g,'')),c=>c.charCodeAt(0))
    );
    const dataStr=JSON.stringify(DATA);
    // 마커 기반 교체 (indexOf로 안전하게)
    const markerStr='// END_DEFAULT_DATA';
    const s=currentContent.indexOf('const DEFAULT_DATA=[');
    const e=currentContent.indexOf(markerStr)+markerStr.length+3;
    if(s<0||e<3){throw new Error('DEFAULT_DATA 마커를 찾지 못했습니다.');}
    const updated=currentContent.slice(0,s)+'const DEFAULT_DATA='+dataStr+'\n'+markerStr+'\n];'+currentContent.slice(e);
    const updated2=updated;

    if(updated===currentContent)throw new Error('DEFAULT_DATA 교체 실패...');
    // 3. UTF-8 safe base64 인코딩
    const encoded=btoa(unescape(encodeURIComponent(updated2)));

    // 4. 파일 업데이트
    const res=await fetch('https://api.github.com/repos/'+GITHUB_REPO+'/contents/'+GITHUB_FILE,{
      method:'PUT',
      headers:{'Authorization':'token '+GITHUB_TOKEN,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
      body:JSON.stringify({message:'Update casebook data '+VERSION+' - '+new Date().toLocaleString('ko-KR'),content:encoded,sha:shaData.sha})
    });
    if(res.ok){
      btn.textContent='✅ 저장 완료! (30초 내 반영)';
      setTimeout(()=>{btn.textContent='🔄 GitHub에 저장';btn.disabled=false;},4000);
    }else{
      const errData=await res.json();
      throw new Error('GitHub API 오류 '+res.status+': '+(errData.message||''));
    }
  }catch(e){
    alert('저장 실패: '+e.message);
    btn.textContent='🔄 GitHub에 저장';
    btn.disabled=false;
  }
}
els.githubSaveBtn.onclick=saveToGithub;

if(els.addCardBtn)els.addCardBtn.onclick=addNewCard;

// ===== 이벤트 바인딩 =====
els.closePresenter.onclick=closePDF;
els.presenterPrevBtn.onclick=()=>move(-1);
els.presenterNextBtn.onclick=()=>move(1);

document.addEventListener('keydown',e=>{
  if(els.presenter.classList.contains('show')){
    if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();move(1);return}
    if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1);return}
  }
  if(e.key==='Escape'){
    if(els.editModal.classList.contains('show'))els.editModal.classList.remove('show');
    else closePDF();
  }
});

document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&els.presenter.classList.contains('show')){
    els.presenter.classList.remove('show');
    els.pdfFrame.src='';
    document.body.style.overflow='';
    activeUid=null;
  }
});

els.exportBtn.onclick=exportConfig;
els.importFile.onchange=e=>{if(e.target.files[0])importConfig(e.target.files[0]);e.target.value=''};
els.addPdfFile.onchange=e=>{if(e.target.files[0])addPDF(e.target.files[0]);e.target.value=''};
els.resetDataBtn.onclick=resetAll;
els.editPreviewBtn.onclick=()=>preview(Number(els.editPreviewPage.value)||1);
els.editPreviewPage.onkeydown=e=>{if(e.key==='Enter')preview(Number(els.editPreviewPage.value)||1)};
els.addBusinessBtn.onclick=addBiz;
els.delBusinessBtn.onclick=delBiz;
els.addIndustryBtn.onclick=addInd;
els.delIndustryBtn.onclick=delInd;
els.closeEditBtn.onclick=()=>els.editModal.classList.remove('show');
els.cancelEditBtn.onclick=()=>els.editModal.classList.remove('show');
els.addEquipBtn.onclick=()=>addRow({field:'기타/검토필요',page:1,show:true});
els.saveEditBtn.onclick=saveEdit;
els.deleteCaseBtn.onclick=()=>{
  let p=get(editingId);if(!p)return;
  p.showCard=!(p.showCard!==false);
  save();els.editModal.classList.remove('show');apply();
};
els.removeCaseBtn.onclick=()=>{
  let p=get(editingId);
  if(p&&confirm('이 카드('+p.company+')를 완전히 삭제할까요?')){
    DATA=DATA.filter(x=>x.uid!==editingId);
    save();els.editModal.classList.remove('show');filters();apply();
  }
};

// 검색창 초기화 버튼
[els.searchInput,els.yearFilter,els.businessFilter,els.industryFilter,els.fieldFilter]
  .forEach(el=>el.addEventListener(el.tagName==='INPUT'?'input':'change',apply));
els.searchInput.addEventListener('input',()=>{
  const cb=$('clearSearchBtn');
  if(cb)cb.style.display=els.searchInput.value?'inline':'none';
});
els.resetBtn.onclick=()=>{
  els.searchInput.value='';
  els.yearFilter.value='';
  els.businessFilter.value='';
  els.industryFilter.value='';
  els.fieldFilter.value='';
  const cb=$('clearSearchBtn');
  if(cb)cb.style.display='none';
  apply();
};

// ===== 초기 실행 =====
filters();
apply();
const vb=document.getElementById('versionBadge');if(vb)vb.textContent='v'+VERSION;
</script>
</body>
</html>
