async function saveToGithub(){
  if(!GITHUB_TOKEN||GITHUB_TOKEN==='REPLACE_TOKEN'){alert('GitHub Token? ???? ?????.\nindex.html?? REPLACE_TOKEN? ?? ???? ??????.');return;}
  const btn=els.githubSaveBtn;
  btn.textContent='?? ?...';btn.disabled=true;
  try{
    // GitHub?? ?? ?? SHA + ?? ????
    const shaRes=await fetch('https://api.github.com/repos/'+GITHUB_REPO+'/contents/'+GITHUB_FILE,{
      headers:{'Authorization':'token '+GITHUB_TOKEN,'Accept':'application/vnd.github.v3+json'}
    });
    if(!shaRes.ok)throw new Error('GitHub ?? ?? ??: '+shaRes.status);
    const shaData=await shaRes.json();
    // ?? HTML?? DEFAULT_DATA? ?? DATA? ??
    const currentContent=decodeURIComponent(escape(atob(shaData.content.replace(/\n/g,''))));
    const dataStr=JSON.stringify(DATA);
    const updated=currentContent.replace(/const DEFAULT_DATA=\[[\s\S]*?\];/,'const DEFAULT_DATA='+dataStr+';');
    if(updated===currentContent){throw new Error('DEFAULT_DATA ?? ?? - ??? ?? ?????.');}
    const encoded=btoa(unescape(encodeURIComponent(updated)));
    // ?? ????
    const res=await fetch('https://api.github.com/repos/'+GITHUB_REPO+'/contents/'+GITHUB_FILE,{
      method:'PUT',
      headers:{'Authorization':'token '+GITHUB_TOKEN,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
      body:JSON.stringify({message:'Update casebook data - '+new Date().toLocaleString('ko-KR'),content:encoded,sha:shaData.sha})
    });
    if(res.ok){
      btn.textContent='? ?? ??! (30? ? ??)';
      setTimeout(()=>{btn.textContent='? GitHub? ??';btn.disabled=false;},4000);
    }else{
      const errData=await res.json();
      throw new Error('GitHub API ?? '+res.status+': '+(errData.message||''));
    }
  }catch(e){
    alert('?? ??: '+e.message);
    btn.textContent='? GitHub? ??';
    btn.disabled=false;
  }
}
els.githubSaveBtn.onclick=saveToGithub;
